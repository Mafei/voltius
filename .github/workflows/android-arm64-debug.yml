name: Android ARM64 debug

on:
  push:
    branches:
      - 'candidate/android-*'

permissions:
  contents: read

concurrency:
  group: android-arm64-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Mafei/voltius'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      VOLTIUS_REQUIRE_SEEDED_PLUGINS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install the pinned build tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          npm install --global pnpm@11.5.2
          rustup show
          rustup target add aarch64-linux-android

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting and relevant regressions
        run: |
          mkdir -p android-ci-artifacts
          cargo fmt --all --check 2>&1 | tee android-ci-artifacts/rustfmt.log
          pnpm test 2>&1 | tee android-ci-artifacts/frontend-tests.log
          cargo test --locked -p voltius-crypto 2>&1 | tee android-ci-artifacts/crypto-tests.log

      - name: Build the development-signed ARM64 APK
        run: pnpm tauri android build --target aarch64 --apk --debug 2>&1 | tee android-ci-artifacts/android-build.log

      - name: Check transfer safety regressions on the Linux host
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libsecret-1-dev openssh-sftp-server
          cargo test --locked -p voltius --lib commands::sftp::resume -- --skip '::live::' 2>&1 | tee android-ci-artifacts/sftp-resume-tests.log
          cargo test --locked -p voltius --lib commands::wsl::tests 2>&1 | tee android-ci-artifacts/wsl-timeout-tests.log
          cargo test --locked -p voltius --lib port_forward:: 2>&1 | tee android-ci-artifacts/port-forward-tests.log

      - name: Verify and collect APK evidence
        run: |
          python3 scripts/verify-android-apk.py src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk android-ci-artifacts
          cp LICENSE NOTICE.md android-ci-artifacts/
          cp docs/android-fork-build.md android-ci-artifacts/BUILD-NOTICE.md

      - name: Preserve APK and build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Voltius-arm64-debug-${{ github.sha }}
          path: android-ci-artifacts/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
