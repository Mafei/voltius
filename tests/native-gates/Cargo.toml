[package]
name = "voltius-native-gates"
version = "0.1.0"
edition = "2021"
[dependencies]
russh = { version = "=0.65.0", default-features = false, features = ["flate2", "rsa", "ring", "des"] }
tempfile = "=3.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "time", "sync"] }
tokio-util = { version = "=0.7.20", features = ["io", "io-util", "rt"] }
bytes = { version = "=1.12.1" }
russh-sftp = "=3.0.1"

quick-xml = "=0.42.0"
httpdate = "1"
suppaftp = { version = "=12.2.1", default-features = false, features = ["tokio-rustls-ring"] }

sha2 = "0.11.1"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "=0.8.5"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

[dev-dependencies]
p256 = { version = "=0.14.0", features = ["ecdsa"] }
base64 = "=0.23.1"
ssh-key = { version = "=0.6.7", features = ["ed25519", "p256", "p384", "p521", "rsa", "encryption"] }

[workspace]

[patch.crates-io]
ssh-key-legacy = { package = "ssh-key", path = "../../vendor/ssh-key-0.6.7" }
ssh-key-current = { package = "ssh-key", path = "../../vendor/ssh-key-0.7.0-rc.11" }
