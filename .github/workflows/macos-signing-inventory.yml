name: Read-only macOS signing inventory
on:
  push:
    branches: ['build/macos-signing-inventory-*']
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    if: github.repository == 'Mafei/voltius'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '38013144488'
      SOURCE_SHA: '4ce05b99986355548aed886a81bf31c20be96b15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Obtain the exact already delivered application without building or signing
        run: |
          mkdir -p original-artifact app-work signing-inventory
          test "$(gh api "repos/Mafei/voltius/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/Mafei/voltius/actions/runs/$SOURCE_RUN/jobs" --jq '.jobs[] | select(.name=="macos-arm64") | .conclusion')" = success
          gh run download "$SOURCE_RUN" --repo Mafei/voltius --name "Voltius-macos-arm64-test-$SOURCE_SHA" --dir original-artifact
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('original-artifact');name='Voltius_0.52.1_4ce05b99_macos-arm64-adhoc-test.zip';p=root/name
          assert hashlib.file_digest(p.open('rb'),'sha256').hexdigest()=='40bd23ebef57b2133208e1e5ff3760ab51211ab7d32755ba5cef4a9a823ea9fa'
          with zipfile.ZipFile(p) as z:
              entries=[{'path':i.filename,'size':i.file_size,'directory':i.is_dir(),'sha256':None if i.is_dir() else hashlib.sha256(z.read(i)).hexdigest()} for i in z.infolist()]
          out=pathlib.Path('signing-inventory');(out/'ZIP-FILE-LIST.json').write_text(json.dumps(entries,indent=2)+'\n')
          artifact=[{'path':str(p.relative_to(root)),'size':p.stat().st_size} for p in root.rglob('*') if p.is_file()]
          (out/'ARTIFACT-FILE-LIST.json').write_text(json.dumps(artifact,indent=2)+'\n')
          print(json.dumps({'package':name,'bytes':p.stat().st_size,'app_archive_entries':entries,'evidence_files':artifact},indent=2))
          PY
          ditto -x -k original-artifact/Voltius_0.52.1_4ce05b99_macos-arm64-adhoc-test.zip app-work
      - name: Read all bundle signatures, entitlements, load commands and resources
        run: |
          app="$PWD/app-work/Voltius.app"
          codesign --verify --deep --strict --verbose=4 "$app" 2>&1 | tee signing-inventory/verification.txt
          codesign -dvvv -r- "$app" 2>&1 | tee signing-inventory/signature.txt
          codesign -d --entitlements :- "$app" > signing-inventory/entitlements.plist 2> signing-inventory/entitlements.log
          plutil -p "$app/Contents/Info.plist" | tee signing-inventory/Info.plist.txt
          cp "$app/Contents/Info.plist" signing-inventory/Info.plist
          cp "$app/Contents/_CodeSignature/CodeResources" signing-inventory/CodeResources.plist
          : > signing-inventory/macho-files.txt
          while IFS= read -r -d '' path; do
            if file -b "$path" | grep -q 'Mach-O'; then
              printf '\nFILE %s\n' "${path#"$app"/}" >> signing-inventory/macho-files.txt
              file "$path" >> signing-inventory/macho-files.txt
              lipo -archs "$path" >> signing-inventory/macho-files.txt
              codesign -dvvv -r- "$path" >> signing-inventory/macho-files.txt 2>&1
              otool -L "$path" >> signing-inventory/macho-files.txt
              otool -l "$path" | grep -A6 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' >> signing-inventory/macho-files.txt
            fi
          done < <(find "$app" -type f -print0)
          cat signing-inventory/macho-files.txt signing-inventory/entitlements.plist signing-inventory/entitlements.log
          python3 - <<'PY'
          import json,pathlib,plistlib,hashlib
          root=pathlib.Path('app-work/Voltius.app');out=pathlib.Path('signing-inventory')
          entries=[{'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          plist=plistlib.loads((root/'Contents/Info.plist').read_bytes());raw=(out/'entitlements.plist').read_bytes()
          report={'source_run':38013144488,'candidate_sha':'4ce05b99986355548aed886a81bf31c20be96b15','application_baseline':'47a009190e9c3cb4bf2678f37d8dfe26a59ec113','bundle_files':entries,'info_plist':plist,'entitlements':plistlib.loads(raw) if raw.strip() else None,'read_only':True,'built':False,'signed':False,'launched':False,'credentials_created_or_imported':False}
          (out/'SIGNING-INVENTORY.json').write_text(json.dumps(report,indent=2,default=str)+'\n')
          print(json.dumps(report,indent=2,default=str))
          PY
          sw_vers | tee signing-inventory/runner-os.txt
      - name: Preserve inventory only, no app copy or credentials
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Voltius-macos-signing-inventory-${{ github.sha }}
          path: signing-inventory/
          retention-days: 14
          if-no-files-found: error
