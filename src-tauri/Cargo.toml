[package]
name = "voltius"
version = "0.63.1"
description = "Open-Source SSH & SFTP Client"
authors = ["Voltius Contributors"]
edition = "2021"

[lib]
name = "voltius_lib"
crate-type = ["cdylib", "rlib"]

# NOTE: profiles are defined at the workspace root (Cargo.toml). Cargo ignores
# `[profile.*]` in non-root members, so they must not live here.

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
url = "2"
quick-xml = "0.42.0"
httpdate = "1"
percent-encoding = "2"
infer = "0.22.0"
png = "0.18.1"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-shell = "2.5.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-clipboard-manager = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "time", "sync"] }
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
# `des` enables the 3des-cbc cipher for the optional legacy-algorithms toggle.
russh = { version = "0.65.0", default-features = false, features = ["flate2", "rsa", "ring", "des"] }
russh-sftp = "3.0.1"
tokio-socks = "0.5"
tokio-util = { version = "0.7.20", default-features = false, features = ["io", "io-util", "rt"] }
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
tower-service = "0.3"
http-body-util = "0.1.5"
bytes = "1.12.1"
tauri-plugin-dialog = "2.8.3"
async-trait = "0.1.92"
thiserror = "2.0.21"
log = "0.4.34"
tauri-plugin-log = "2.10.1"
voltius-diagnostics = { path = "../crates/voltius-diagnostics" }
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
voltius-crypto = { path = "../crates/voltius-crypto" }
hkdf = "0.13.0"
sha2 = "0.11.1"
zeroize = "1.9.1"
rand = "0.8"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
keyring-core = "1.0.1"
base64 = "0.23.1"
hostname = "0.4"
crypto_secretbox = "0.1"
rusty-leveldb = "4.0.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
ruzstd = "0.9.1"
tar = "0.4"
flate2 = "1.1.10"
portable-pty = "0.9"
ssh-key = { version = "0.6", features = ["ed25519", "p256", "p384", "p521", "rsa", "encryption"] }
rsa = { version = "0.9", features = ["getrandom"] }
sysinfo = "0.39.6"
# Pure-Rust font enumeration for the theme editor's font pickers. `fontdb` scans the
# OS font directories itself, so it needs no fontconfig/CoreText/DirectWrite linkage
# and stays out of the cross-compile images' way.
fontdb = { version = "0.24", default-features = false, features = ["fs", "memmap", "std"] }
bollard = "0.21.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
serialport = { version = "4.10.1", default-features = false }
aes = "0.9.3"
cfb8 = "0.9"
cbc = { version = "0.2.1", features = ["block-padding"] }
blowfish = { version = "0.10", features = ["bcrypt"] }
# `ring` to match russh's existing TLS backend (avoid pulling in aws-lc-rs too).
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-rustls-ring"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.0"
minisign-verify = "0.3.0"
tauri-plugin-single-instance = "2.5.4"
# machine-uid 0.6 has no Android/iOS backend (its lib.rs fails to compile there).
# Desktop reads it via raw_machine_id(); mobile uses ANDROID_ID instead (see vault.rs).
machine-uid = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "windows")'.dependencies]
# Keep COM/WinRT type families aligned with Tauri2.12 (not windows-core0.100).
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
windows-registry = "0.100.0"
windows-native-keyring-store = "1"
windows = { version = "0.62.2", features = ["Security_Credentials_UI", "Win32_System_WinRT"] }
windows-future = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Persistent credential store: the Secret Service (gnome-keyring/KWallet) over
# libdbus. The kernel keyutils store below is volatile (wiped on logout/reboot),
# which silently drops account_id/master_password and breaks auto-login + unlock
# on a fresh session. We keep keyutils as a headless/no-daemon fallback.
# crypto-rust: pure-Rust transport encryption (no system openssl); libdbus is
# bound dynamically (no `vendored`), matching the system-libsecret approach below.
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
linux-keyutils-keyring-store = "1"
# Termius/keytar stores its master key in the Secret Service (libsecret), not in
# the kernel keyutils store above; we query it directly to import. We bind the
# system libsecret (already loaded via webkit2gtk) rather than a bundled pure-Rust
# D-Bus client (zbus), which roughly doubled the Linux binary. glib/gio are pinned
# to 0.18 to match the versions Tauri already compiles, so nothing is duplicated.
libsecret = "0.4"
gio = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# reqwest's default rustls path uses aws-lc-rs + rustls-platform-verifier, which hangs
# the TLS handshake on Android (aws-lc-rs / uninitialised platform trust store). We hand
# reqwest a preconfigured ring + bundled-webpki-roots ClientConfig instead (see commands/http.rs).
# `ring` is already in the tree (russh); rustls is pinned to reqwest's 0.23 line.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.11"

[dev-dependencies]
# Issues throwaway certificates for the TLS proxy tests, so no private key is committed.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
tempfile = "3"
# Paused clock, so stall-watchdog tests skip the real 15 s wait.
tokio = { version = "1.54.1", features = ["test-util"] }
vt100 = "0.18.1"
