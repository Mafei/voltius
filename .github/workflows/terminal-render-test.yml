name: macOS ARM64 atlas diagnostic candidate
on:
  push:
    branches: ['candidate/desktop-render-macos-atlas-20261027-89211d21']
permissions:
  contents: read
concurrency:
  group: macos-atlas-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '3'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  VOLTIUS_REQUIRE_SEEDED_PLUGINS: '1'
jobs:
  native-build:
    if: github.repository == 'Mafei/voltius'
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify raw upstream patch bytes and tested product identity
        shell: bash
        run: python3 scripts/verify-upstream-inputs.py --self-test --evidence desktop-platform-evidence/input-integrity.json
      - name: Require the reviewed rendering and dependency baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          baseline=$(git log --format=%H --fixed-strings --grep='Imported-from-commit: 89211d216bec165e2f07db568bcd454a06ca1a50' -1)
          test -n "$baseline"
          test "$(git rev-parse "$baseline^{tree}")" = 6434396055c282d511921603e4274340eaf4ffbb
          git merge-base --is-ancestor "$baseline" HEAD
          printf 'Checkout SHA: %s\nImported application baseline: %s\n' "$GITHUB_SHA" "$baseline"
      - uses: ./.github/actions/build-desktop-platform
        with:
          target: aarch64-apple-darwin
          bundles: app
          label: macos-arm64-atlas-diagnostic
          frontend-tests: 'true'
