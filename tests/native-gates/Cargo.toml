[package]
name = "voltius-native-gates"
version = "0.1.0"
edition = "2021"
[dependencies]
russh = { version = "=0.64.1", default-features = false, features = ["flate2", "rsa", "ring", "des"] }
tempfile = "=3.27.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149" }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "time", "sync"] }
tokio-util = { version = "=0.7.18", features = ["io", "io-util", "rt"] }
bytes = { version = "=1.11.1" }
russh-sftp = "=2.3.0"

[workspace]
