name: Build and verify desktop test bundles
description: Locked desktop build, existing ad-hoc signing and normal startup; no publication or credentials.
inputs:
  target:
    description: Rust target
    required: true
  bundles:
    description: Tauri bundle kinds
    required: true
  label:
    description: Artifact platform label
    required: true
  frontend-tests:
    description: Run full frontend regressions
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/prepare-desktop
    - name: Full frontend regressions for this candidate
      if: inputs.frontend-tests == 'true'
      shell: bash
      run: |
        mkdir -p desktop-platform-evidence
        pnpm test --maxWorkers=1 2>&1 | tee desktop-platform-evidence/frontend-tests.log
    - name: Build locked native application without updater signing or publication
      shell: bash
      run: |
        mkdir -p desktop-platform-evidence
        rustup target add '${{ inputs.target }}'
        if [[ "$RUNNER_OS" == macOS ]]; then test "$(uname -m)" = arm64; fi
        pnpm tauri build --ci --target '${{ inputs.target }}' --bundles '${{ inputs.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked 2>&1 | tee desktop-platform-evidence/native-build.log
    - name: Check macOS local PTY, shell and synthetic system SSH regressions
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        while IFS='|' read -r label filter; do
          cargo test --locked --lib "$filter" 2>&1 | tee "desktop-platform-evidence/$label-tests.log"
        done <<'FILTERS'
        system-ssh|ssh::system_auth
        private-key|ssh::private_key
        local|local::
        shell|commands::local::
        biometric-policy|system_auth::macos::
        bundled-keychain|keychain_bundle::tests::
        FILTERS
    - name: Verify ARM64, ad-hoc signatures and ordinary LaunchServices startup
      if: runner.os == 'macOS'
      shell: bash
      run: bash scripts/verify-desktop-app.sh target/aarch64-apple-darwin/release/bundle/macos/Voltius.app desktop-platform-evidence
    - name: Check Windows authentication policy parsing
      if: runner.os == 'Windows'
      shell: bash
      run: cargo test --locked --lib ssh::system_auth::tests 2>&1 | tee desktop-platform-evidence/system-ssh-tests.log
    - name: Verify Windows PE, unsigned packages and normal cloud startup
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/verify-desktop-windows.ps1 -Binary target/x86_64-pc-windows-msvc/release/voltius.exe -BundleDirectory target/x86_64-pc-windows-msvc/release/bundle -Evidence desktop-platform-evidence
    - name: Preserve platform test packages and evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: Voltius-${{ inputs.label }}-test-${{ github.sha }}
        path: desktop-platform-evidence/
        retention-days: 14
        if-no-files-found: error
