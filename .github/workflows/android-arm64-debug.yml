name: Android ARM64 debug

on:
  push:
    branches:
      - 'candidate/android-*'
      - 'candidate/desktop-sessions-*'

permissions:
  contents: read

concurrency:
  group: android-arm64-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Mafei/voltius'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '4'
      VOLTIUS_REQUIRE_SEEDED_PLUGINS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install the pinned build tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          npm install --global pnpm@11.5.2
          rustup show
          rustup target add aarch64-linux-android

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install verified Zellij integration test tools
        run: |
          bash scripts/install-desktop-test-tools.sh

      - name: Record zsh global startup diagnostics
        run: |
          mkdir -p android-ci-artifacts
          sudo apt-get update -qq
          sudo apt-get install -y zsh tmux openssh-client
          rc_dir="$(mktemp -d)"
          trap 'rm -rf "$rc_dir"' EXIT
          for mode in -i -di; do
            printf 'zsh mode %s\n' "$mode"
            ZDOTDIR="$rc_dir" zsh "$mode" -c 'print -r -- "status after global startup: $?"; autoload -Uz compaudit; compaudit || true'
          done 2>&1 | tee android-ci-artifacts/zsh-global-startup.log

      - name: Check formatting and relevant regressions
        run: |
          mkdir -p android-ci-artifacts
          cargo fmt --all --check 2>&1 | tee android-ci-artifacts/rustfmt.log
          pnpm test 2>&1 | tee android-ci-artifacts/frontend-tests.log
          cargo test --locked -p voltius-crypto 2>&1 | tee android-ci-artifacts/crypto-tests.log

      - name: Build the development-signed ARM64 APK
        id: android_build
        run: pnpm tauri android build --target aarch64 --apk --debug 2>&1 | tee android-ci-artifacts/android-build.log

      - name: Check Android IME composition contracts
        if: ${{ !cancelled() && steps.android_build.outcome == 'success' }}
        run: |
          (cd src-tauri/gen/android && ./gradlew :app:testUniversalDebugUnitTest --tests com.voltius.app.TerminalKeyboardTest --console=plain) 2>&1 | tee android-ci-artifacts/android-ime-tests.log
          cp src-tauri/gen/android/app/build/test-results/testUniversalDebugUnitTest/*.xml android-ci-artifacts/

      - name: Check transfer safety regressions on the Linux host
        if: ${{ !cancelled() && steps.android_build.outcome == 'success' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libsecret-1-dev openssh-sftp-server zsh tmux
          regressions_failed=0
          printf 'module\texit_code\n' > android-ci-artifacts/native-regression-results.tsv
          while read -r module log_name; do
            test_args=(--locked -p voltius --lib "$module")
            if [[ "$module" == commands::sftp::resume ]]; then
              test_args+=(-- --skip '::live::')
            fi
            exit_code=0
            cargo test "${test_args[@]}" 2>&1 | tee "android-ci-artifacts/$log_name" || exit_code=$?
            printf '%s\t%s\n' "$module" "$exit_code" >> android-ci-artifacts/native-regression-results.tsv
            if [[ "$exit_code" -ne 0 ]]; then
              regressions_failed=1
            fi
          done <<'REGRESSIONS'
          commands::sftp::resume sftp-resume-tests.log
          commands::wsl::tests wsl-timeout-tests.log
          port_forward:: port-forward-tests.log
          passkey_loopback:: passkey-loopback-tests.log
          shell_integration:: shell-integration-tests.log
          storage::profile:: storage-profile-tests.log
          storage::config::tests storage-config-tests.log
          commands::sftp::editor:: sftp-editor-tests.log
          commands::sftp::paste:: sftp-paste-tests.log
          ssh::exec:: ssh-exec-tests.log
          ssh::tmux:: tmux-session-tests.log
          ssh::zellij:: zellij-session-tests.log
          ssh::multiplexer:: multiplexer-protocol-tests.log
          ssh::client::tests ssh-client-auth-tests.log
          commands::openssh:: openssh-config-tests.log
          commands::keygen:: keygen-tests.log
          storage::secrets:: storage-secrets-tests.log
          REGRESSIONS
          exit "$regressions_failed"

      - name: Run the complete native workspace suite
        if: ${{ !cancelled() && steps.android_build.outcome == 'success' }}
        run: cargo test --locked --workspace 2>&1 | tee android-ci-artifacts/native-workspace-tests.log

      - name: Verify and collect APK evidence
        if: ${{ !cancelled() && steps.android_build.outcome == 'success' }}
        run: |
          python3 scripts/verify-android-apk.py src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk android-ci-artifacts
          cp LICENSE NOTICE.md android-ci-artifacts/
          cp docs/android-fork-build.md android-ci-artifacts/BUILD-NOTICE.md
          cp docs/android-input-and-tmux.md android-ci-artifacts/INPUT-AND-TMUX-NOTICE.md
          cp docs/android-session-types.md android-ci-artifacts/SESSION-TYPES-NOTICE.md

      - name: Preserve APK and build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Voltius-arm64-debug-${{ github.sha }}
          path: android-ci-artifacts/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
