[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compile-sdk = "37"
target-sdk = "36"
min-sdk = "24"
build-tools = "37.0.0"
ndk = "30.0.16248370"
webkit = "1.18.0"
appcompat = "1.8.0"
activity = "1.13.0"
material = "1.14.0"
lifecycle = "2.11.0"
splashscreen = "1.2.0"
security-crypto = "1.1.0"
biometric = "1.1.0"
documentfile = "1.1.0"
junit = "4.13.2"
robolectric = "4.17"
android-test-junit = "1.3.0"
espresso = "3.7.0"

jackson = "2.22.4"
tink = "1.24.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
android-test-junit = { module = "androidx.test.ext:junit", version.ref = "android-test-junit" }
espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
