[package]
name = "voltius-crypto"
version = "0.4.0"
edition = "2021"
description = "Shared pure-Rust crypto primitives for Voltius"
license = "AGPL-3.0"

[dependencies]
argon2 = "0.6.0"
hkdf = "0.13.0"
sha2 = "0.11.1"
getrandom = "0.4.2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
